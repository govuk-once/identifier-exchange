# Package-only overrides, merged into platform-pkg-dev's master config by `dev sync`.
# See pre-commit.extend.yaml.example for the format.

# detect-secrets imports PyYAML (its YAML transformer), but the hook environment
# on the CI runner was built without it: "ModuleNotFoundError: No module named
# 'yaml'". Listing it explicitly guarantees it is installed, and changes the
# environment's cache key so pre-commit builds a fresh one.
detect-secrets:
  additional_dependencies:
    - pyyaml

# cspell is a node hook. Without a version pre-commit asks nodeenv for the latest
# Node, which is now a pre-release (27.0.0-alpha...) that nodeenv cannot parse
# ("invalid literal for int() ... '0-alpha'"). Use the Node already installed
# (.nvmrc locally, setup-node in CI) instead of downloading one.
cspell:
  language_version: system
