application: Identifier Exchange

pr:
  title:
    comment: true
    examples: |
      IDX-123 feat: add user preferences endpoint
      IDX-456 fix(udp): handle empty payload
      IDX-789 feat!: drop legacy auth

quality:
  aws: true # cdk synth for checkov
  setup: python3 -m pip install semgrep pre-commit checkov
  checks:
    - name: Hygiene
      run: pre-commit run --all-files --show-diff-on-failure
